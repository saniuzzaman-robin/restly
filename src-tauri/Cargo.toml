[package]
name = "restly"
version = "1.0.0"
description = "Restly - Modern API Workspace & Client"
authors = ["Restly"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

name: "Publish Desktop Releases"

on:
  push:
    tags:
      - 'v*' # Triggers workflow on version tags like v1.0.0, v1.0.1, etc.

jobs:
  publish-tauri:
    permissions:
      contents: write # Required to create GitHub Releases and upload assets
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # Builds .dmg and .app for macOS
          - platform: 'windows-latest' # Builds .exe and .msi for Windows

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v24)
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install webkit2gtk (Linux / Cross-check)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm install

      - name: Build and Publish Tauri Desktop App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Restly ${{ github.ref_name }}'
          releaseBody: 'See the assets below to download Restly for macOS (.dmg) and Windows (.exe).'
          releaseDraft: false
          prerelease: false
